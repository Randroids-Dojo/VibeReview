name: VibeReview
options:
  bundleIdPrefix: com.randroid
  deploymentTarget:
    macOS: "13.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.4.0"
targets:
  VibeReview:
    type: application
    platform: macOS
    sources:
      - VibeReview
      - path: ChromeExtension
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randroid.VibeReview
        EXECUTABLE_SUFFIX: App
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: VibeReview/VibeReview.entitlements
        MARKETING_VERSION: 0.1.4
        CURRENT_PROJECT_VERSION: 8
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
  VibeReviewCLI:
    type: tool
    platform: macOS
    sources:
      - VibeReviewCLI
      - VibeReview/Models
      - path: VibeReview/Services/BrowserSnapshotServer.swift
      - path: VibeReview/Services/DateFormats.swift
      - path: VibeReview/Services/HTML.swift
      - path: VibeReview/Services/JSONCoding.swift
      - path: VibeReview/Services/ProjectDiscovery.swift
      - path: VibeReview/Services/ScreenshotCapture.swift
      - path: VibeReview/Services/SessionPersistence.swift
      - path: VibeReview/Services/SessionStore.swift
      - path: VibeReview/Services/SpiralHTMLWriter.swift
      - path: VibeReview/Services/VibeReviewCommandLine.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randroid.VibeReviewCLI
        PRODUCT_NAME: vibereview
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 0.1.4
        CURRENT_PROJECT_VERSION: 8
        ENABLE_HARDENED_RUNTIME: NO
  VibeReviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - VibeReviewTests
    dependencies:
      - target: VibeReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randroid.VibeReviewTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(BUILT_PRODUCTS_DIR)/VibeReview.app/Contents/MacOS/VibeReviewApp"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VibeReview.app/Contents/MacOS/VibeReviewApp"
        SWIFT_INCLUDE_PATHS:
          - "$(inherited)"
          - "$(CONFIGURATION_TEMP_DIR)/VibeReview.build/Objects-normal/arm64"
          - "$(CONFIGURATION_TEMP_DIR)/VibeReview.build/Objects-normal/x86_64"
  VibeReviewUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - VibeReviewUITests
    dependencies:
      - target: VibeReview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.randroid.VibeReviewUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VibeReview:
    build:
      parallelizeBuild: false
      targets:
        VibeReview: all
        VibeReviewCLI: all
    test:
      targets:
        - VibeReviewTests
        - VibeReviewUITests
